version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"   # Communication port
      - "15672:15672" # Dashboard port
    container_name: wowmania-rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build: ./user-service
    ports:
      - "8081:8081"
    container_name: user-service
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq

  marketplace-service:
    build: ./marketplace-service
    ports:
      - "8082:8082"
    container_name: marketplace-service

  order-service:
    build: ./order-service
    ports:
      - "8083:8083"
    container_name: order-service
    depends_on:
      marketplace-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      - SERVICE_MARKETPLACE_URL=http://marketplace-service:8082
      - SPRING_RABBITMQ_HOST=rabbitmq