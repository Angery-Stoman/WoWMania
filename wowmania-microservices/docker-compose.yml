version: '3.8'

services:
  user-service:
    build: ./user-service
    ports:
      - "8081:8081"
    container_name: user-service

  marketplace-service:
    build: ./marketplace-service
    ports:
      - "8082:8082"
    container_name: marketplace-service

  order-service:
    build: ./order-service
    ports:
      - "8083:8083"
    container_name: order-service
    environment:
      - SERVICE_MARKETPLACE_URL=http://marketplace-service:8082
    depends_on:
      - marketplace-service